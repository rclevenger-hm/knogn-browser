name: build-and-test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Privacy contract
        run: python tests/privacy_contract.py
      - name: Source contract
        run: python tests/source_contract.py
      - name: Performance contract
        run: python tests/performance_contract.py
      - name: Media compatibility contract
        run: python tests/media_contract.py
      - name: Branding contract
        run: python tests/branding_contract.py
      - name: Daily-driver contract
        run: python tests/daily_driver_contract.py
      - name: Federated identity compatibility contract
        run: python tests/identity_contract.py
      - name: Chromium backend bootstrap contract
        run: python tests/chromium_backend_contract.py
      - name: Chromium primary-backend contract
        run: python tests/chromium_primary_contract.py

  chromium-tooling-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Exercise overlay, build safety, evidence and loopback transport
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  # This tests the harness against the runner's browser, not Knogn compatibility.
  # The dedicated engine workflow must produce Knogn's own playback evidence.
  chromium-playback-harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install local fixture generator
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Generate synthetic video and audio fixtures
        run: python tools/build_knogn.py media-fixtures --out test-results/media --include-proprietary
      - name: Exercise direct and MSE playback with the sandbox enabled
        run: |
          browser="$(command -v google-chrome)"
          python engine/chromium/probe_runtime.py --binary "$browser" \
            --media-dir test-results/media --require-media --report test-results/harness.json
      - name: Keep harness evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-playback-harness
          path: test-results/harness.json
          if-no-files-found: warn
          retention-days: 14

  # Qt is retained only as a compatibility fallback during the 0.3 migration.
  # Full Chromium builds run in chromium-engine.yml on dedicated self-hosted capacity.
  qt-fallback-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt fallback dependencies
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          modules: 'qtwebengine qtwebchannel qtpositioning qttasktree'
          cache: true
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e'
          extra: '--base https://download.qt.io'
      - name: Configure Qt fallback
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build Qt fallback
        run: cmake --build build --config Release --parallel 2
