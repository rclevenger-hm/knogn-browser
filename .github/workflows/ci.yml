name: build-and-test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Privacy contract
        run: python tests/privacy_contract.py
      - name: Source contract
        run: python tests/source_contract.py
      - name: Performance contract
        run: python tests/performance_contract.py
      - name: Media compatibility contract
        run: python tests/media_contract.py
      - name: Branding contract
        run: python tests/branding_contract.py
      - name: Daily-driver contract
        run: python tests/daily_driver_contract.py
      - name: Federated identity compatibility contract
        run: python tests/identity_contract.py

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          modules: 'qtwebengine qtwebchannel qtpositioning qttasktree'
          cache: true
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e'
          extra: '--base https://download.qt.io'
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
