name: chromium-engine

on:
  workflow_dispatch:
    inputs:
      media_experiment:
        description: 'Enable local H.264/AAC codec parity experiment; never publish this output automatically'
        required: true
        default: false
        type: boolean
      build_browser:
        description: 'Build the full Chromium browser target after bootstrap'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

# All invocations share one persistent source tree; never mutate it concurrently.
concurrency:
  group: knogn-chromium-workspace
  cancel-in-progress: false

# Full Chromium source/build work is isolated from ordinary hosted PR runners.
# A runner with this label needs substantial persistent disk/RAM/CPU and must not
# execute untrusted workloads. The workspace is intentionally persistent so
# Chromium source and object caches survive between runs.
jobs:
  linux-engine:
    runs-on: [self-hosted, linux, x64, knogn-chromium]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Select isolated output and evidence paths
        shell: bash
        run: |
          output=Knogn
          if [[ "${{ inputs.media_experiment }}" == "true" ]]; then
            output=KnognMedia
          fi
          echo "KNOGN_OUT=$HOME/knogn-chromium/chromium/src/out/$output" >> "$GITHUB_ENV"
          echo "KNOGN_EVIDENCE=$RUNNER_TEMP/knogn-evidence-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"

      - name: Preflight Chromium build host
        run: python engine/chromium/preflight.py --workspace "$HOME/knogn-chromium"

      - name: Validate Chromium backend contracts
        run: |
          python tests/chromium_backend_contract.py
          python tests/chromium_primary_contract.py
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Prepare and build Knogn Chromium
        shell: bash
        run: |
          set -euo pipefail
          args=(--workspace "$HOME/knogn-chromium" --execute)
          if [[ "${{ inputs.media_experiment }}" == "true" ]]; then
            args+=(--media-experiment)
          fi
          if [[ "${{ inputs.build_browser }}" == "true" ]]; then
            args+=(--build)
          fi
          python engine/chromium/bootstrap.py "${args[@]}"

      - name: Record engine build identity
        if: ${{ inputs.build_browser }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$KNOGN_EVIDENCE"
          cp "$KNOGN_OUT/knogn-build.json" "$KNOGN_EVIDENCE/build.json"
          browser="$KNOGN_OUT/chrome"
          test -x "$browser"
          echo "Chromium pin: $(cat engine/chromium/chromium_version.txt)"
          "$browser" --version

      - name: Generate local playback fixtures
        if: ${{ inputs.build_browser }}
        shell: bash
        run: |
          args=(--out "$KNOGN_EVIDENCE/media")
          if [[ "${{ inputs.media_experiment }}" == "true" ]]; then
            args+=(--include-proprietary)
          fi
          python engine/chromium/generate_media_fixtures.py "${args[@]}"

      - name: Probe browser identity and actual media playback
        if: ${{ inputs.build_browser }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--out "$KNOGN_OUT" --media-dir "$KNOGN_EVIDENCE/media" --report "$KNOGN_EVIDENCE/runtime.json")
          if [[ "${{ inputs.media_experiment }}" == "true" ]]; then
            args+=(--require-media)
          fi
          python engine/chromium/probe_runtime.py "${args[@]}"

      - name: Keep build and runtime evidence only
        if: ${{ always() && inputs.build_browser }}
        uses: actions/upload-artifact@v4
        with:
          name: chromium-evidence-${{ github.run_id }}
          path: |
            ${{ env.KNOGN_EVIDENCE }}/build.json
            ${{ env.KNOGN_EVIDENCE }}/runtime.json
          if-no-files-found: warn
          retention-days: 30

      - name: Media experiment distribution guard
        if: ${{ inputs.media_experiment }}
        shell: bash
        run: |
          echo "The proprietary-codec engine experiment is build-and-test only."
          echo "Only JSON evidence may be uploaded; no browser binary, CDM, package or media fixture is published."
