name: chromium-engine

on:
  workflow_dispatch:
    inputs:
      media_experiment:
        description: 'Enable local H.264/AAC codec parity experiment; never publish this output automatically'
        required: true
        default: false
        type: boolean
      build_browser:
        description: 'Build the full Chromium browser target after bootstrap'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

# Full Chromium source/build work is isolated from ordinary hosted PR runners.
# A runner with this label needs substantial persistent disk/RAM/CPU and must not
# execute untrusted workloads. The workspace is intentionally persistent so
# Chromium source and object caches survive between runs.
jobs:
  linux-engine:
    runs-on: [self-hosted, linux, x64, knogn-chromium]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Preflight Chromium build host
        run: python engine/chromium/preflight.py --workspace "$HOME/knogn-chromium"

      - name: Validate Chromium backend contracts
        run: |
          python tests/chromium_backend_contract.py
          python tests/chromium_primary_contract.py

      - name: Prepare and build Knogn Chromium
        shell: bash
        run: |
          set -euo pipefail
          args=(--workspace "$HOME/knogn-chromium" --execute)
          if [[ "${{ inputs.media_experiment }}" == "true" ]]; then
            args+=(--media-experiment)
          fi
          if [[ "${{ inputs.build_browser }}" == "true" ]]; then
            args+=(--build)
          fi
          python engine/chromium/bootstrap.py "${args[@]}"

      - name: Record engine build identity
        if: ${{ inputs.build_browser }}
        shell: bash
        run: |
          set -euo pipefail
          browser="$HOME/knogn-chromium/chromium/src/out/Knogn/chrome"
          test -x "$browser"
          echo "Chromium pin: $(cat engine/chromium/chromium_version.txt)"
          "$browser" --version

      - name: Probe browser identity and web-platform surfaces
        if: ${{ inputs.build_browser }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--out "$HOME/knogn-chromium/chromium/src/out/Knogn")
          if [[ "${{ inputs.media_experiment }}" == "true" ]]; then
            args+=(--require-media)
          fi
          python engine/chromium/probe_runtime.py "${args[@]}"

      - name: Media experiment distribution guard
        if: ${{ inputs.media_experiment }}
        shell: bash
        run: |
          echo "The proprietary-codec engine experiment is build-and-test only."
          echo "No package or artifact upload is permitted by this workflow."
