name: package-installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x86_64
          - os: windows-2025
            artifact: windows-x86_64
          - os: macos-15
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          modules: 'qtwebengine qtwebchannel qtpositioning qttasktree'
          cache: true
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e'
          extra: '--base https://download.qt.io'

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cpack --config build/CPackConfig.cmake -G DEB -B dist
          cpack --config build/CPackConfig.cmake -G TXZ -B dist

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          cpack --config build/CPackConfig.cmake -G NSIS -B dist
          cpack --config build/CPackConfig.cmake -G ZIP -B dist

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          cpack --config build/CPackConfig.cmake -G DragNDrop -B dist
          cpack --config build/CPackConfig.cmake -G ZIP -B dist

      - name: Validate package contents and report sizes
        shell: bash
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import tarfile
          import zipfile

          dist = Path('dist')
          packages = sorted(p for p in dist.iterdir() if p.is_file())
          if not packages:
              raise SystemExit('No package files were generated')

          for path in packages:
              print(f'{path.name}: {path.stat().st_size / (1024 * 1024):.1f} MiB')

          os_name = os.environ['RUNNER_OS_NAME']
          if os_name == 'Linux':
              archive = next(dist.glob('*.tar.xz'))
              with tarfile.open(archive, 'r:xz') as handle:
                  names = handle.getnames()
              required = ['bin/Knogn', 'QtWebEngineProcess', 'qtwebengine_resources.pak']
          else:
              archive = next(dist.glob('*.zip'))
              with zipfile.ZipFile(archive) as handle:
                  names = handle.namelist()
              if os_name == 'Windows':
                  required = ['Knogn.exe', 'QtWebEngineProcess.exe', 'qtwebengine_resources.pak']
              else:
                  required = [
                      'Knogn.app/Contents/MacOS/Knogn',
                      'QtWebEngineProcess.app/Contents/MacOS/QtWebEngineProcess',
                      'qtwebengine_resources.pak',
                  ]

          missing = [needle for needle in required if not any(needle in name for name in names)]
          if missing:
              raise SystemExit(f'Package is missing required runtime content: {missing}')
          print(f'Validated {archive.name}: required Knogn and Qt WebEngine runtime content is present')
          PY

      - name: Generate SHA-256 checksums
        shell: bash
        env:
          ARTIFACT_NAME: ${{ matrix.artifact }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import os

          dist = Path('dist')
          files = sorted(p for p in dist.iterdir() if p.is_file() and not p.name.startswith('SHA256SUMS-'))
          lines = []
          for path in files:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f'{digest}  {path.name}')
          output = dist / f"SHA256SUMS-{os.environ['ARTIFACT_NAME']}.txt"
          output.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: knogn-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: knogn-*
          path: release
          merge-multiple: true

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --title "Knogn $GITHUB_REF_NAME" \
              --generate-notes
          fi
