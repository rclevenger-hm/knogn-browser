name: qt-compat-packages

on:
  workflow_dispatch:

permissions:
  contents: read

# Knogn 0.2.1 is the final Qt-WebEngine compatibility line. This workflow is
# retained only for manual regression/support builds. New public Knogn releases
# must come from the full Chromium backend.
jobs:
  package-qt-fallback:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x86_64
          - os: windows-2025
            artifact: windows-x86_64
          - os: macos-15
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Resolve compatibility version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re
          text = Path('CMakeLists.txt').read_text(encoding='utf-8')
          match = re.search(r'project\(KnognBrowser\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)', text)
          if not match:
              raise SystemExit('Could not read Qt compatibility version')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f'KNOGN_VERSION={match.group(1)}\n')
          PY

      - name: Install Qt fallback dependencies
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          modules: 'qtwebengine qtwebchannel qtpositioning qttasktree'
          cache: true
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e'
          extra: '--base https://download.qt.io'

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Configure Qt fallback
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Qt fallback
        run: cmake --build build --config Release --parallel 2

      - name: Package Linux fallback
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cpack --config build/CPackConfig.cmake -G DEB -B dist
          cpack --config build/CPackConfig.cmake -G TXZ -B dist

      - name: Package Windows fallback
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          cpack --config build/CPackConfig.cmake -G NSIS -B dist
          cpack --config build/CPackConfig.cmake -G ZIP -B dist

      - name: Package macOS fallback with DMG retry
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for attempt in 1 2 3; do
            if cpack --config build/CPackConfig.cmake -G DragNDrop -B dist; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "DMG generation failed after $attempt attempts" >&2
              exit 1
            fi
            echo "DMG generation attempt $attempt failed; detaching stale images and retrying"
            hdiutil info | awk '/\/dev\// {print $1}' | sort -u | while read -r dev; do
              hdiutil detach "$dev" -force >/dev/null 2>&1 || true
            done
            rm -rf dist/_CPack_Packages
            sleep 3
          done
          cpack --config build/CPackConfig.cmake -G ZIP -B dist

      - name: Remove CPack staging directory
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          staging = Path('dist/_CPack_Packages')
          if staging.exists():
              shutil.rmtree(staging)
          PY

      - name: Generate checksums
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('dist')
          files = sorted(p for p in root.iterdir() if p.is_file())
          lines = [f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}" for p in files]
          (root / 'SHA256SUMS.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Upload Qt compatibility artifacts
        uses: actions/upload-artifact@v4
        with:
          name: knogn-qt-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
